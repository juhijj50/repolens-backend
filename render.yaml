services:
  - type: web
    name: repolens-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python -m app.embedder
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      # glibc otherwise makes one malloc arena per thread, which bloats RSS
      - key: MALLOC_ARENA_MAX
        value: "2"